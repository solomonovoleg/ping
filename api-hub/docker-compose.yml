services:
  api-hub-db:
    image: postgres:16
    container_name: api-hub-db
    environment:
      POSTGRES_DB: api_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - api-hub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  api-hub-db-data:
