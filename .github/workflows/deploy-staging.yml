# Автодеплой стенда при пуше в feature/dev (без мержа в main).
# Секреты: см. docs/DEPLOY_STAGING_CI.md

name: Deploy staging

on:
  push:
    branches:
      - feature/dev
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install sshpass (password SSH for deploy.sh)
        run: sudo apt-get update && sudo apt-get install -y sshpass openssh-client rsync

      - name: Write deploy.env from secret
        env:
          STAGING_DEPLOY_ENV: ${{ secrets.STAGING_DEPLOY_ENV }}
        run: |
          if [ -z "${STAGING_DEPLOY_ENV}" ]; then
            echo "::error::В GitHub → Settings → Secrets → Actions добавь секрет STAGING_DEPLOY_ENV"
            echo "Содержимое — как в локальном deploy.staging.env (см. deploy.staging.env.example и docs/DEPLOY_STAGING_CI.md)"
            exit 1
          fi
          python3 << 'PY'
          import os
          body = os.environ.get("STAGING_DEPLOY_ENV", "")
          with open("deploy.env", "w", encoding="utf-8", newline="\n") as f:
              f.write(body)
              if not body.endswith("\n"):
                  f.write("\n")
          PY

      # deploy.sh читает только PM2_APP_NAME; старый APP_NAME из секрета иначе даёт дефолт ping-moot → риск пересечься с prod.
      - name: PM2_APP_NAME из APP_NAME (если забыли переименовать)
        run: |
          if grep -q '^PM2_APP_NAME=' deploy.env; then
            echo "PM2_APP_NAME уже задан"
            exit 0
          fi
          line=$(grep '^APP_NAME=' deploy.env | head -1 || true)
          if [ -n "$line" ]; then
            val="${line#APP_NAME=}"
            echo "PM2_APP_NAME=${val}" >> deploy.env
            echo "OK: добавлен PM2_APP_NAME из APP_NAME"
          else
            echo "::warning::В STAGING_DEPLOY_ENV нет PM2_APP_NAME — проверь, что на сервере не используется дефолт ping-moot"
          fi

      # Только этот workflow (push в feature/dev). Production (npm run deploy с твоим deploy.env) этот шаг НЕ выполняет.
      # Без этого заход по http://IP:3081 не сохраняет сессию при SESSION_SECURE=true в секрете → лента /posts и посты «мертвые».
      - name: Staging HTTP — сессионная кука без Secure
        env:
          STAGING_HTTPS_COOKIE: ${{ vars.STAGING_HTTPS_COOKIE }}
        run: |
          if [ "${STAGING_HTTPS_COOKIE}" = "true" ]; then
            echo "STAGING_HTTPS_COOKIE=true — не трогаем SESSION_SECURE из секрета (HTTPS-стенд)."
            exit 0
          fi
          sed -i '/^SESSION_SECURE=/d' deploy.env
          echo "SESSION_SECURE=false" >> deploy.env
          echo "OK: для стенда по HTTP выставлено SESSION_SECURE=false"

      - name: Build and deploy (same as npm run deploy)
        env:
          DEPLOY_USE_SSHPASS: "1"
        run: bash scripts/deploy.sh
