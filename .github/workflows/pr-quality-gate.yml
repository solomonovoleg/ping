name: PR Quality Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - "client/**"
      - "server/**"
      - "EDGE/**"
      - "PARSER/**"
      - "ПИНГОК МИКРО/**"
      - "shared/**"
      - "api-hub/**"
      - "scripts/**"
      - "migrations/**"
      - ".github/workflows/pr-quality-gate.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "drizzle.config.ts"
      - "script/build.ts"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api_hub:
              - "api-hub/**"

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check (root)
        run: npm run check

      - name: Test (content report targets)
        run: npm run test:report-targets

      - name: Build (root)
        run: npm run build

      - name: Install api-hub dependencies
        if: steps.filter.outputs.api_hub == 'true'
        run: npm ci --prefix api-hub

      - name: Type check (api-hub)
        if: steps.filter.outputs.api_hub == 'true'
        run: npm run check:api-hub

      - name: Test (api-hub)
        if: steps.filter.outputs.api_hub == 'true'
        run: npm run test:api-hub

      - name: Build (api-hub)
        if: steps.filter.outputs.api_hub == 'true'
        run: npm run build:api-hub
