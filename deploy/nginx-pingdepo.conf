# Nginx: тестовый стенд pingdepo.ru — прокси на приложение (порт 5550).
# Зеркало deploy/nginx-ping-moot.conf (pingos.ru), но для тестового слоя.
#
# Конфиг самодостаточный: map/upstream описаны в этом же файле.
#
# Установка конфига (на VPS):
#   sudo cp deploy/nginx-pingdepo.conf /etc/nginx/sites-available/pingdepo.ru
#   sudo ln -sf /etc/nginx/sites-available/pingdepo.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# WebSocket для звонков: /calls и /group-calls с явным upgrade и таймаутами.
# Без этого браузер показывает "Bad response from the server" при wss://.../calls.
#
# /uploads/ — отдача с диска (alias), не через Node: Safari/мобильные сети реже рвут MP4.
# Путь = VPS_PATH из deploy.test.env (по умолчанию /var/www/ping-moot-test).
# Если alias-путь не совпал с фактическим VPS_PATH, используем fallback на Node для /uploads.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ping_moot_test {
    server 127.0.0.1:5550;
    keepalive 32;
}

server {
    server_name pingdepo.ru www.pingdepo.ru;

    client_max_body_size 550m;

    # WebSocket для звонков — без этого wss://pingdepo.ru/calls не подключается
    location = /calls {
        proxy_pass http://ping_moot_test;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location = /group-calls {
        proxy_pass http://ping_moot_test;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ПИНГОК МИКРО
    location /pingok-micro-standalone/ {
        proxy_pass http://127.0.0.1:5591/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Отдача с диска; если файла нет — на Node (плейсхолдер вместо 404 в консоли).
    # root + $uri, не alias + try_files (у alias try_files часто даёт ложный miss/hit).
    location ^~ /uploads/ {
        root /var/www/ping-moot-test;
        try_files $uri @uploads_via_node;
        sendfile on;
        tcp_nopush on;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://ping_moot_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location @uploads_via_node {
        proxy_pass http://ping_moot_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pingdepo.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pingdepo.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.pingdepo.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = pingdepo.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pingdepo.ru www.pingdepo.ru;
    return 404; # managed by Certbot
}
