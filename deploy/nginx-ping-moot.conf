# Nginx: только для домена pingos.ru — прокси на приложение (порт 3080).
# Другие проекты не трогаем. У этого конфига свой server_name — по HTTPS
# открывается именно PING MOOT, а не другой проект.
#
# Перед включением HTTPS получить сертификат (один раз):
#   sudo certbot certonly --webroot -w /var/www/html -d pingos.ru -d www.pingos.ru
# или: sudo certbot certonly --nginx -d pingos.ru -d www.pingos.ru
#
# Установка конфига:
#   cp deploy/nginx-ping-moot.conf /etc/nginx/sites-available/pingos.ru
#   ln -sf /etc/nginx/sites-available/pingos.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# WebSocket для звонков: отдельный location /calls с явным upgrade и таймаутами 24ч.
# Без этого браузер может показывать "The network connection was lost" при wss://.../calls.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ping_moot {
    server 127.0.0.1:3080;
    keepalive 32;
}

# HTTP — редирект на HTTPS (раскомментируй после настройки SSL)
# server {
#     listen 80;
#     server_name pingos.ru www.pingos.ru;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name pingos.ru www.pingos.ru;

    # Загрузка шапки/аватара/постов до 6 МБ — без этого nginx по умолчанию 1m даёт 413
    client_max_body_size 10m;

    # WebSocket для звонков — отдельный location, чтобы upgrade не терялся
    location = /calls {
        proxy_pass http://ping_moot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location / {
        proxy_pass http://ping_moot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# HTTPS — свой server_name, чтобы https://pingos.ru шёл сюда, а не в другой проект
server {
    listen 443 ssl;
    server_name pingos.ru www.pingos.ru;

    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/pingos.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pingos.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket для звонков (wss://pingos.ru/calls) — явный location
    location = /calls {
        proxy_pass http://ping_moot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location / {
        proxy_pass http://ping_moot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
